[project]
name = "autonomous-content-agents"
version = "0.1.0"
description = "LangGraph multi-agent workflow for content generation with local LLM inference."
authors = [{ name = "Vitaliy Babchuk", email = "babchuk.vit@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tweepy>=4.14.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_agents"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["content_agents"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
packages = ["content_agents"]
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tweepy.*", "feedparser.*", "langchain_openai.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external services",
    "integration: tests requiring external services",
    "vllm: requires running vLLM at OPENAI_API_BASE",
    "network: requires internet (RSS, HTTP)",
    "twitter: requires Twitter API credentials",
    "gpu: requires GPU-backed inference",
    "slow: long-running E2E tests",
]
addopts = "-m 'not (integration or vllm or network or twitter or gpu or slow)'"
